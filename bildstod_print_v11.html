<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildstöd – utskrift</title>
<style>
@page { size: A4 portrait; margin: 6mm; }

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:#f0f4f8;
  color:#111;
  padding:14px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  max-width:1100px;
  margin:0 auto 10px auto;
}
header .title{ font-weight:900; font-size:18px; }
.controls{
  display:flex;
  gap:10px;
}
.btn{
  font-size:16px;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #cfd8e3;
  background:#fff;
  cursor:pointer;
}
.btn:hover{ background:#eef3fb; }

.picto-wrap{ width:100%; max-width:1100px; margin:0 auto; }

/* A4: 297mm. Marginal 6mm topp+botten => 285mm användbart. */
:root{
  --pageH: 285mm;
}

.picto-day{
  background:#fff;
  height: var(--pageH);
  display:flex;
  flex-direction:column;
  break-after: page;
  page-break-after: always;
}
/* Sista dagen delar sidan med källhänvisningsraden - ge den lite mindre
   höjd så båda garanterat får plats (samma lärdom som från veckoschemat). */
.picto-day:last-child{
  height: calc(var(--pageH) - 8mm);
  break-after: auto;
  page-break-after: auto;
}

.picto-day-title{
  text-align:center;
  font-size:17pt;
  font-weight:900;
  padding:5mm 0;
  border-radius:10px;
  margin-bottom:3mm;
  flex-shrink:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.rubrik-mandag{ background:#a8d98a; }
.rubrik-tisdag{ background:#8ec8ec; }
.rubrik-onsdag{ background:#ffffff; border:2px solid #000; }
.rubrik-torsdag{ background:#b98a5a; color:#fff; }
.rubrik-fredag{ background:#f5e05a; }

.picto-rader{
  flex:1;
  display:grid;
  gap: 3mm;
  min-height:0;
}

/* Aktivitetskort: klocka+tid till vänster, bild+namn+coach till höger */
.picto-item{
  border: 2.5px solid #000;
  border-radius: 12px;
  display:grid;
  grid-template-columns: 30mm 1fr;
  overflow:hidden;
  min-height:0;
  break-inside: avoid;
  page-break-inside: avoid;
}

.picto-time-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.5mm;
  border-right: 2px solid #000;
  background:#fafafa;
  padding:2mm 1mm;
  min-width:0;
}
.picto-time-cell .klocka{ display:block; }
.picto-time-cell .klocka svg{ display:block; width:100%; height:100%; }
.picto-time{
  text-align:center;
  font-weight:900;
  line-height:1.0;
  white-space:nowrap;
}
.picto-act{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.5mm;
  text-align:center;
  overflow:hidden;
  padding:2mm;
  min-height:0;
}
.picto-act .emoji{ line-height:0.95; flex-shrink:1; min-height:0; }
.picto-act .pictoimg{ object-fit:contain; flex-shrink:1; min-height:0; }
.picto-act .label{
  font-weight:900;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.picto-coach-rad{
  display:flex;
  align-items:center;
  gap:2mm;
}
.picto-coach-avatar{
  border-radius:50%;
  background:#cbd5e1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:#475569;
  flex-shrink:0;
  /* Plats reserverad för framtida foto på coachen - byt bakgrund mot
     <img class="picto-coach-avatar" src="..."> när foton finns. */
}
.picto-coach{
  font-weight:700;
  color:#475569;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hint{ text-align:center; margin:18mm auto 0 auto; font-size:14px; color:#333; max-width:700px; }

.kredit{
  text-align:center;
  font-size:8pt;
  color:#666;
  margin-top:3mm;
}

@media print{
  body{ background:#fff; padding:0; }
  header{ display:none !important; }
  .btn{ display:none !important; }
  .hint{ display:none !important; }
  .picto-wrap{ max-width:none !important; margin:0 !important; }
}
</style>
</head>
<body>

<header>
  <div class="title">Bildstöd</div>
  <div class="controls">
    <button class="btn" id="btnBack">⬅︎ Tillbaka</button>
    <button class="btn" id="btnPrint">🖨️ Skriv ut</button>

</header>

(function(){
  function analogKlocka(tidStr){
    const m = /(\d{1,2}):(\d{2})/.exec(tidStr || "");
    if (!m) return "";
    const h = parseInt(m[1], 10) % 12;
    const min = parseInt(m[2], 10);
    const minAngle = min * 6;
    const hourAngle = (h + min / 60) * 30;
    const cx = 30, cy = 30, r = 27;
    function point(angleDeg, length) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return [cx + length * Math.cos(rad), cy + length * Math.sin(rad)];
    }
    let marks = "";
    for (let i = 0; i < 12; i++) {
      const a = i * 30;
      const [x1, y1] = point(a, r - 3);
      const [x2, y2] = point(a, r - (i % 3 === 0 ? 9 : 5));
      marks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#000" stroke-width="${i % 3 === 0 ? 2.2 : 1.3}"/>`;
    }
    const [hx, hy] = point(hourAngle, 13);
    const [mx, my] = point(minAngle, 22);
    return `<svg viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#000" stroke-width="2.5"/>
      ${marks}
      <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="2.2" fill="#000"/>
    </svg>`;
  }

  function veckodagsKlass(text){
    const t = (text || "").toLowerCase();
    if (t.includes("mån")) return "rubrik-mandag";
    if (t.includes("tis")) return "rubrik-tisdag";
    if (t.includes("ons")) return "rubrik-onsdag";
    if (t.includes("tors")) return "rubrik-torsdag";
    if (t.includes("fre")) return "rubrik-fredag";
    return "";
  }

  function getData(){
    try{
      const raw = localStorage.getItem("PICTO_DATA_V1");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    try{
      if(window.opener && window.opener.__PICTO_DATA__) return window.opener.__PICTO_DATA__;
    }catch(e){}
    return null;
  }

  function goBack(){
    const backUrl = (localStorage.getItem("PICTO_BACK_URL") || "").trim();
    if(backUrl){
      location.href = backUrl;
      return;
    }
    history.back();
  }

  document.getElementById("btnBack").addEventListener("click", goBack);
  document.getElementById("btnPrint").addEventListener("click", ()=>window.print());

  const data = getData();
  const out = document.getElementById("output");

  if(!data || !Array.isArray(data) || !data.length){
    out.innerHTML = "<div class='hint'>Ingen bildstödsdata mottagen.<br>Öppna huvudfilen och klicka Bildstöd därifrån.</div>";
    return;
  }

  const root = document.documentElement.style;

  data.forEach(day => {
    if(!day.items || !day.items.length) return;

    const items = day.items.slice(0, 8);
    const antal = items.length;

    const dayDiv = document.createElement("div");
    dayDiv.className = "picto-day";

    const title = document.createElement("div");
    title.className = "picto-day-title " + veckodagsKlass(day.title);
    title.textContent = day.title;
    dayDiv.appendChild(title);

    const raderDiv = document.createElement("div");
    raderDiv.className = "picto-rader";
    raderDiv.style.gridTemplateRows = `repeat(${antal}, 1fr)`;
    dayDiv.appendChild(raderDiv);

    items.forEach(item => {
      const el = document.createElement("div");
      el.className = "picto-item";

      // Använd riktig bild om vi har en för aktiviteten, annars emoji som förut.
      const bildUrl = PICTO_BILDER[item.label];
      const bildHtml = bildUrl
        ? `<img class="pictoimg" src="${bildUrl}" alt="${item.label || ''}" />`
        : `<div class="emoji">${item.emoji || "✨"}</div>`;

      const coachHtml = (item.coach && item.coach !== "-")
        ? `<div class="picto-coach-rad">
             <div class="picto-coach-avatar">${(item.coach[0] || "").toUpperCase()}</div>
             <div class="picto-coach">${item.coach}</div>
           </div>`
        : "";

      el.innerHTML = `
        <div class="picto-time-cell">
          <span class="klocka">${analogKlocka(item.time)}</span>
          <div class="picto-time">${item.time || ""}</div>
        </div>
        <div class="picto-act">
          ${bildHtml}
          <div class="label">${item.label || ""}</div>
          ${coachHtml}
        </div>
      `;
      raderDiv.appendChild(el);
    });

    out.appendChild(dayDiv);

    // ===== Skala storlekar efter antal aktiviteter denna dag (färre
    // aktiviteter -> större kort), sedan mät verklig höjd i webbläsaren
    // och krymp ytterligare stegvis om något ändå inte får plats. Samma
    // beprövade teknik som löste veckoschemat. =====
    anpassaStorlekar(raderDiv, antal);
    krympTillsDetFarPlats(raderDiv);
  });

  function anpassaStorlekar(raderDiv, antal){
    const t = Math.max(0, Math.min(1, (antal - 3) / (8 - 3)));
    const lerp = (stor, litet) => stor + (litet - stor) * t;

    const digitalPt = lerp(15, 11);
    const namnPt    = lerp(20, 13);
    const coachPt   = lerp(12, 9);
    const avatarMm  = lerp(8, 5.5);
    const bildMm    = lerp(30, 16);
    const klockMm   = lerp(16, 9);

    raderDiv.querySelectorAll(".picto-time").forEach(e => e.style.fontSize = digitalPt + "pt");
    raderDiv.querySelectorAll(".label").forEach(e => e.style.fontSize = namnPt + "pt");
    raderDiv.querySelectorAll(".picto-coach").forEach(e => e.style.fontSize = coachPt + "pt");
    raderDiv.querySelectorAll(".picto-coach-avatar").forEach(e => {
      e.style.width = avatarMm + "mm"; e.style.height = avatarMm + "mm";
      e.style.fontSize = (avatarMm * 0.45) + "mm";
    });
    raderDiv.querySelectorAll(".pictoimg, .emoji").forEach(e => {
      e.style.maxHeight = bildMm + "mm";
      e.style.maxWidth = (bildMm * 1.8) + "mm";
    });
    raderDiv.querySelectorAll(".emoji").forEach(e => e.style.fontSize = bildMm + "mm");
    raderDiv.querySelectorAll(".klocka").forEach(e => {
      e.style.width = klockMm + "mm"; e.style.height = klockMm + "mm";
    });
  }

  function allaRaderFarPlats(raderDiv){
    const rader = raderDiv.querySelectorAll(".picto-item");
    for (const r of rader){
      if (r.scrollHeight > r.clientHeight + 0.5) return false;
    }
    return true;
  }

  function krympTillsDetFarPlats(raderDiv){
    let steg = 0;
    let skala = 1.0;

    // Spara [element, CSS-egenskap, basvärde, enhet] för allt vi kan krympa.
    const bas = [];
    raderDiv.querySelectorAll(".picto-time").forEach(e => bas.push([e, "fontSize", parseFloat(e.style.fontSize), "pt"]));
    raderDiv.querySelectorAll(".label").forEach(e => bas.push([e, "fontSize", parseFloat(e.style.fontSize), "pt"]));
    raderDiv.querySelectorAll(".picto-coach").forEach(e => bas.push([e, "fontSize", parseFloat(e.style.fontSize), "pt"]));
    raderDiv.querySelectorAll(".picto-coach-avatar").forEach(e => {
      bas.push([e, "width", parseFloat(e.style.width), "mm"]);
      bas.push([e, "height", parseFloat(e.style.height), "mm"]);
      bas.push([e, "fontSize", parseFloat(e.style.fontSize), "mm"]);
    });
    raderDiv.querySelectorAll(".pictoimg, .emoji").forEach(e => {
      bas.push([e, "maxHeight", parseFloat(e.style.maxHeight), "mm"]);
      bas.push([e, "maxWidth", parseFloat(e.style.maxWidth), "mm"]);
    });
    raderDiv.querySelectorAll(".emoji").forEach(e => bas.push([e, "fontSize", parseFloat(e.style.fontSize), "mm"]));
    raderDiv.querySelectorAll(".klocka").forEach(e => {
      bas.push([e, "width", parseFloat(e.style.width), "mm"]);
      bas.push([e, "height", parseFloat(e.style.height), "mm"]);
    });

    while (steg < 30 && skala > 0.35){
      if (allaRaderFarPlats(raderDiv)) return;
      skala -= 0.03;
      bas.forEach(([e, prop, varde, enhet]) => {
        const golv = enhet === "pt" ? 2.5 : 2;
        e.style[prop] = Math.max(varde * skala, golv) + enhet;
      });
      steg++;
    }
  }

  // Kreditrad längst ner (bara på sista sidan, en gång - inte per bild).
  const kredit = document.createElement("div");
  kredit.className = "kredit";
  kredit.textContent = "Piktogram: ARASAAC (CC BY-NC-SA), Sergio Palao / Regeringen i Aragonien · Papunets bildbank, papunet.net (CC BY-NC-SA) · Pool 8 Ball: OpenMoji-projektet (CC BY-SA)";
  out.appendChild(kredit);
})();
</script>
